# Agent Reliability Harness configuration.
# CLI flags on run_eval.py override the matching keys here.

# --- Model / API -----------------------------------------------------------
model: nvidia/nemotron-3-ultra-550b-a55b   # do NOT use a Nemotron Nano model
base_url: https://integrate.api.nvidia.com/v1
api_key_env: NVIDIA_API_KEY

temperature: 0.6        # fixed; trial-to-trial variance is part of what we measure
top_p: 0.95
max_tokens: 4096        # per LLM call (reasoning tokens count against this)
request_timeout_s: 180

# Extra request body passed straight through to the API, e.g.
#   extra_body: {chat_template_kwargs: {enable_thinking: false}}
extra_body: {}

# --- Agent -----------------------------------------------------------------
tool_mode: native       # native = API tool calling | json = tools described in the prompt, JSON reply parsed
max_steps: 10           # LLM calls per run; a case's expected.max_steps overrides it

# --- Runner ----------------------------------------------------------------
concurrency: 2
rate_limit_rpm: 35      # client-side request pacing shared across workers (0 = off)
retry:
  max_retries: 6        # on 429 / 5xx / connection errors; never counted as agent steps
  base_delay_s: 2.0
  max_delay_s: 60.0

fixture: fixtures/db.json
cases: cases/*.yaml
results_dir: results
fault_timeout_s: 0      # real sleep before a simulated tool timeout (0 keeps runs fast)

# --- Reference pricing -----------------------------------------------------
# The NVIDIA hosted API is free, so cost is a REFERENCE figure only.
pricing:
  input_per_1m_usd: 0.50
  output_per_1m_usd: 2.20
  source: "OpenRouter models API (https://openrouter.ai/api/v1/models), id nvidia/nemotron-3-ultra-550b-a55b"
  retrieved: "2026-10-08"
