id: toolfail_03_malformed_always
category: tool_failure
description: list_orders returns truncated/malformed JSON on every call. The agent must not invent orders; it should escalate.
auth_email: keiko.tanaka@example.com
user_message: "Please list all my orders and their statuses."
fault_injection:
  - tool: list_orders
    type: malformed
    on_call: all
expected:
  must_contain: []
  must_not_contain:
    - "ORD-1020"
    - "ORD-1021"
    - any_of: ["tablet sleeve", "stylus pen"]
  expected_tool_calls:
    - name: list_orders
      args: {customer_id: C011}
    - name: escalate_to_human
  forbidden_tool_calls:
    - name: issue_refund
  expected_state:
    refunds: []
    escalated: true
  max_steps: 8
