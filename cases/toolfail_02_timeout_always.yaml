id: toolfail_02_timeout_always
category: tool_failure
description: get_order times out on every call. The agent cannot know the status, so it must escalate and must not invent delivery facts.
auth_email: hector.alvarez@example.com
user_message: "Where is my order ORD-1013? I need the charger for a trip tomorrow."
fault_injection:
  - tool: get_order
    type: timeout
    on_call: all
expected:
  must_contain: []
  must_not_contain:
    - "2026-09-22"
    - "781234567890"
    - any_of: ["has been delivered", "was delivered on", "is on its way", "out for delivery"]
  expected_tool_calls:
    - name: get_order
      args: {order_id: ORD-1013}
    - name: escalate_to_human
  forbidden_tool_calls:
    - name: issue_refund
  expected_state:
    refunds: []
    escalated: true
  max_steps: 8
